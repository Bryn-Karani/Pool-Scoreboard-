===================================================== --><script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyBjxhhz_OJBayYsnbmmfNlzKrpM3rUZ1f4",

  authDomain:
    "pool-scoreboard-71c93.firebaseapp.com",

  databaseURL:
    "https://pool-scoreboard-71c93-default-rtdb.firebaseio.com",

  projectId:
    "pool-scoreboard-71c93",

  storageBucket:
    "pool-scoreboard-71c93.firebasestorage.app",

  messagingSenderId:
    "401721132284",

  appId:
    "1:401721132284:web:65b755b148d1163a7a4379",

  measurementId:
    "G-FPBCYM0H1Z"
};


const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const scoreboardRef =
  ref(db, "poolScoreboard/room1");


/* =====================================================
   DOM HELPER
===================================================== */

const $ = id =>
  document.getElementById(id);


/* =====================================================
   FIREBASE REALTIME UPDATE
===================================================== */

onValue(
  scoreboardRef,

  snapshot => {

    const data =
      snapshot.val() || {};


    /* Player 1 */

    $("p1").textContent =
      data.p1 ?? "";


    /* Player 2 */

    $("p2").textContent =
      data.p2 ?? "";


    /* Score 1 */

    $("s1").textContent =
      Number(data.s1 ?? 0);


    /* Score 2 */

    $("s2").textContent =
      Number(data.s2 ?? 0);


    /* Frame */

    $("fr").textContent =
      "FRAME " +
      Number(data.frame ?? 1);


    /* Event */

    $("ev").textContent =
      data.event ?? "";


    /* Match */

    $("ma").textContent =
      data.match ?? "";

  },

  error => {

    console.error(
      "Firebase scoreboard error:",
      error
    );

  }

);

</script></body>
