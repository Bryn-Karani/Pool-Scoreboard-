<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pool Scoreboard</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
body{display:flex;align-items:flex-end;justify-content:center}
svg{display:block;width:100%;height:auto;max-width:1100px;shape-rendering:geometricPrecision;text-rendering:geometricPrecision}
text{font-family:Arial,Helvetica,sans-serif;font-weight:700;fill:#fff}
.name{font-size:28px}.score{font-size:48px}.small{font-size:14px;letter-spacing:.5px}.frame{font-size:13px;fill:#aeb4bd}
</style></head><body>
<svg viewBox="0 0 1100 150" preserveAspectRatio="xMidYMax meet" role="img" aria-label="Live pool scoreboard">
<rect x="0" y="0" width="1100" height="150" fill="transparent"/>
<rect x="0" y="0" width="1100" height="105" rx="3" fill="#111318"/>
<rect x="0" y="0" width="7" height="105" fill="#2375d8"/>
<rect x="1093" y="0" width="7" height="105" fill="#d9363e"/>
<rect x="0" y="105" width="1100" height="45" fill="#08090b"/>
<text id="p1" class="name" x="28" y="64" text-anchor="start"></text>
<text id="p2" class="name" x="1072" y="64" text-anchor="end"></text>
<text id="s1" class="score" x="450" y="69" text-anchor="middle">0</text>
<text id="s2" class="score" x="650" y="69" text-anchor="middle">0</text>
<text id="fr" class="frame" x="550" y="69" text-anchor="middle">FRAME 1</text>
<text id="ev" class="small" x="24" y="133" text-anchor="start"></text>
<circle cx="550" cy="127" r="13" fill="#f2f2f2"/><text x="550" y="132" text-anchor="middle" style="font-size:10px;fill:#111">8</text>
<text id="ma" class="small" x="1076" y="133" text-anchor="end"></text>
</svg>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getDatabase,ref,onValue}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyBjxhhz_OJBayYsnbmmfNlzKrpM3rUZ1f4",authDomain:"pool-scoreboard-71c93.firebaseapp.com",databaseURL:"https://pool-scoreboard-71c93-default-rtdb.firebaseio.com",projectId:"pool-scoreboard-71c93",storageBucket:"pool-scoreboard-71c93.firebasestorage.app",messagingSenderId:"401721132284",appId:"1:401721132284:web:65b755b148d1163a7a4379",measurementId:"G-FPBCYM0H1Z"};
const db=getDatabase(initializeApp(firebaseConfig)),r=ref(db,"poolScoreboard/room1");
const $=id=>document.getElementById(id);
onValue(r,s=>{const d=s.val()||{};$("p1").textContent=d.p1??"";$("p2").textContent=d.p2??"";$("s1").textContent=Number(d.s1??0);$("s2").textContent=Number(d.s2??0);$("fr").textContent="FRAME "+Number(d.frame??1);$("ev").textContent=d.event??"";$("ma").textContent=d.match??""});
</script></body></html>
