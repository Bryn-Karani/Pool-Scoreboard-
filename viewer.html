import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";


/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {
  apiKey: "AIzaSyBjxhhz_OJBayYsnbmmfNlzKrpM3rUZ1f4",
  authDomain: "pool-scoreboard-71c93.firebaseapp.com",
  databaseURL: "https://pool-scoreboard-71c93-default-rtdb.firebaseio.com",
  projectId: "pool-scoreboard-71c93",
  storageBucket: "pool-scoreboard-71c93.firebasestorage.app",
  messagingSenderId: "401721132284",
  appId: "1:401721132284:web:65b755b148d1163a7a4379",
  measurementId: "G-FPBCYM0H1Z"
};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const scoreboardRef =
  ref(db, "poolScoreboard/room1");


/* =====================================================
   DOM HELPER
===================================================== */

const $ = id =>
  document.getElementById(id);


/* =====================================================
   LIVE SCOREBOARD
===================================================== */

onValue(scoreboardRef, snapshot => {

  const data = snapshot.val() || {};

  $("p1").textContent =
    data.p1 ?? "";

  $("p2").textContent =
    data.p2 ?? "";

  $("s1").textContent =
    Number(data.s1 ?? 0);

  $("s2").textContent =
    Number(data.s2 ?? 0);

  $("fr").textContent =
    "FRAME " + Number(data.frame ?? 1);

  $("ev").textContent =
    data.event ?? "";

  $("ma").textContent =
    data.match ?? "";

});

</script></body>
