<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pool Scoreboard Overlay</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
body{font-family:Arial,Helvetica,sans-serif;color:#fff}

.wrap{
  position:absolute;
  left:2.5vw;
  right:2.5vw;
  bottom:2.5vh;
  height:auto;
  z-index:10;
  filter:drop-shadow(0 5px 10px rgba(0,0,0,.45));
}

.event{
  position:absolute;
  left:1.5%;
  bottom:calc(100% + 5px);
  font-size:clamp(9px,1.1vw,15px);
  font-weight:800;
  letter-spacing:1px;
  opacity:.9;
  white-space:nowrap;
}

.main{
  width:100%;
  min-height:clamp(54px,10vh,100px);
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(130px,20vw) minmax(0,1fr);
  align-items:stretch;
  background:linear-gradient(180deg,#111722,#070b12);
  border:1px solid rgba(255,255,255,.16);
  border-bottom:0;
  border-radius:8px 8px 0 0;
  overflow:hidden;
}

.player{
  min-width:0;
  display:flex;
  align-items:center;
  font-size:clamp(13px,2.2vw,30px);
  font-weight:800;
  letter-spacing:.7px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  padding:0 clamp(12px,2.2vw,30px);
}

.p1{
  justify-content:flex-start;
  border-left:6px solid #1688ff;
}
.p2{
  justify-content:flex-end;
  border-right:6px solid #ef304c;
  text-align:right;
}

.score{
  min-width:0;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:clamp(10px,1.8vw,24px);
  font-size:clamp(30px,6vw,76px);
  font-weight:900;
  letter-spacing:1px;
  border-left:1px solid rgba(255,255,255,.12);
  border-right:1px solid rgba(255,255,255,.12);
  white-space:nowrap;
}
.score .frames{
  font-size:clamp(13px,1.8vw,24px);
  opacity:.9;
}

.sub{
  width:100%;
  min-height:clamp(27px,4.8vh,48px);
  display:grid;
  grid-template-columns:minmax(0,1fr) clamp(30px,4vw,48px) minmax(0,1fr);
  align-items:center;
  background:rgba(5,8,13,.97);
  border:1px solid rgba(255,255,255,.12);
  border-radius:0 0 6px 6px;
  font-size:clamp(9px,1.25vw,17px);
  font-weight:800;
  letter-spacing:.5px;
}

.left{
  min-width:0;
  padding-left:clamp(14px,3vw,48px);
  text-align:left;
  border-top:2px solid #1688ff;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.right{
  min-width:0;
  padding-right:clamp(14px,3vw,48px);
  text-align:right;
  border-top:2px solid #ef304c;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.mid{text-align:center;font-size:clamp(12px,1.4vw,18px)}
.ball{
  width:clamp(19px,2.8vw,30px);
  height:clamp(19px,2.8vw,30px);
  border-radius:50%;
  background:#f5f5f5;
  color:#111;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
}

@media (orientation:portrait){
  .wrap{left:2%;right:2%;bottom:2%}
  .main{grid-template-columns:minmax(0,1fr) 110px minmax(0,1fr)}
  .player{font-size:clamp(12px,3.6vw,22px);padding:0 12px}
  .score{font-size:clamp(28px,8vw,54px);gap:10px}
  .sub{font-size:clamp(8px,2.4vw,13px)}
}

@media (orientation:landscape) and (max-height:500px){
  .wrap{left:2vw;right:2vw;bottom:1.5vh}
  .main{min-height:clamp(48px,12vh,72px)}
  .sub{min-height:clamp(24px,5vh,36px)}
  .event{bottom:calc(100% + 3px)}
}
</style>
</head>
<body>
<div class="wrap">
<div class="event" id="event">POOL COMPETITION</div>
<div class="main">
<div class="player p1" id="p1">PLAYER 1</div>
<div class="score"><span id="s1">0</span><span class="frames">(<span id="frame">1</span>)</span><span id="s2">0</span></div>
<div class="player p2" id="p2">PLAYER 2</div>
</div>
<div class="sub">
<div class="left" id="status">DA VILLE DOUBLE LIFE COMP</div>
<div class="mid"><span class="ball">8</span></div>
<div class="right" id="match">SEMI FINAL&nbsp;&nbsp;|&nbsp;&nbsp;LIFE 2</div>
</div>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getDatabase,ref,onValue} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyBjxhhz_OJBayYsnbmmfNlzKrpM3rUZ1f4",authDomain:"pool-scoreboard-71c93.firebaseapp.com",databaseURL:"https://pool-scoreboard-71c93-default-rtdb.firebaseio.com",projectId:"pool-scoreboard-71c93",storageBucket:"pool-scoreboard-71c93.firebasestorage.app",messagingSenderId:"401721132284",appId:"1:401721132284:web:65b755b148d1163a7a4379",measurementId:"G-FPBCYM0H1Z"};
const db=getDatabase(initializeApp(firebaseConfig));
onValue(ref(db,"poolScoreboard/room1"),snap=>{const d=snap.val()||{};p1.textContent=d.player1||"PLAYER 1";p2.textContent=d.player2||"PLAYER 2";s1.textContent=d.score1??0;s2.textContent=d.score2??0;frame.textContent=d.frame??1;event.textContent=d.event||"POOL COMPETITION";status.textContent=d.status||"DA VILLE DOUBLE LIFE COMP";match.textContent=d.match||"SEMI FINAL | LIFE 2"});
</script>
</body>
</html>
