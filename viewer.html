<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pool Scoreboard Viewer</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
body{font-family:Arial,Helvetica,sans-serif}
.scoreboard{
  position:absolute;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:min(100%,1100px);
  color:#fff;
  font-weight:700;
  text-transform:uppercase;
}
.top{
  min-height:68px;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  background:#111318;
}
.player{
  padding:14px 24px;
  font-size:clamp(14px,2vw,24px);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.left{border-left:7px solid #2375d8}
.right{text-align:right;border-right:7px solid #d9363e}
.score{
  padding:8px 22px;
  font-size:clamp(22px,3.4vw,40px);
  white-space:nowrap;
}
.bottom{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  min-height:38px;
  background:#08090b;
  font-size:clamp(9px,1.2vw,14px);
  letter-spacing:.04em;
}
.info{padding:9px 18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info.right{text-align:right;border-right:0}
.ball{
  width:25px;height:25px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:#f3f3f3;color:#111;font-size:11px;
}
@media(max-width:600px){
  .player{padding:10px 12px}
  .score{padding:6px 10px}
  .info{padding:7px 10px}
}
</style>
</head>
<body>

<div class="scoreboard">

  <div class="top">
    <div class="player left" id="player1"></div>

    <div class="score">
      <span id="score1">0</span>
      <span> (</span><span id="frame">1</span><span>) </span>
      <span id="score2">0</span>
    </div>

    <div class="player right" id="player2"></div>
  </div>

  <div class="bottom">
    <div class="info" id="event"></div>
    <div class="ball">8</div>
    <div class="info right" id="match"></div>
  </div>

</div>

<script type="module">
import {initializeApp}
from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {getDatabase,ref,onValue}
from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const firebaseConfig={
  apiKey:"AIzaSyBjxhhz_OJBayYsnbmmfNlzKrpM3rUZ1f4",
  authDomain:"pool-scoreboard-71c93.firebaseapp.com",
  databaseURL:"https://pool-scoreboard-71c93-default-rtdb.firebaseio.com",
  projectId:"pool-scoreboard-71c93",
  storageBucket:"pool-scoreboard-71c93.firebasestorage.app",
  messagingSenderId:"401721132284",
  appId:"1:401721132284:web:65b755b148d1163a7a4379",
  measurementId:"G-FPBCYM0H1Z"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);
const roomRef=ref(db,"poolScoreboard/room1");

const defaults={
  p1:"",
  p2:"",
  s1:0,
  s2:0,
  frame:1,
  event:"",
  match:""
};

function render(data){
  const state={
    p1:data.p1 ?? "",
    p2:data.p2 ?? "",
    s1:Number(data.s1 ?? 0),
    s2:Number(data.s2 ?? 0),
    frame:Number(data.frame ?? 1),
    event:data.event ?? "",
    match:data.match ?? ""
  };

  document.getElementById("player1").textContent=state.p1;
  document.getElementById("player2").textContent=state.p2;
  document.getElementById("score1").textContent=state.s1;
  document.getElementById("score2").textContent=state.s2;
  document.getElementById("frame").textContent=state.frame;
  document.getElementById("event").textContent=state.event;
  document.getElementById("match").textContent=state.match;
}

render(defaults);

onValue(roomRef,snapshot=>{
  render(snapshot.val() || defaults);
});
</script>

</body>
</html>
