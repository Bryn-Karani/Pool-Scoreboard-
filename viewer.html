<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pool Viewer</title><style>
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:Arial,sans-serif}
.board{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(96vw,1100px);background:rgba(0,0,0,.88);color:#fff;border-radius:10px;overflow:hidden}
.top{display:flex;justify-content:space-between;padding:10px 18px;background:#111;font-size:clamp(11px,1.7vw,18px);font-weight:700}
.match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;padding:14px}
.player{font-size:clamp(14px,2.4vw,28px);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{font-size:clamp(44px,8vw,90px);font-weight:900;padding:0 22px}
.status{padding:7px;text-align:center;background:#151515;font-size:clamp(10px,1.4vw,15px)}
</style></head><body><div class="board">
<div class="top"><span id="event">POOL COMPETITION</span><span id="frame">FRAME 1</span></div>
<div class="match"><div class="player" id="p1">PLAYER 1</div><div class="score" id="scores">0 - 0</div><div class="player" id="p2">PLAYER 2</div></div>
<div class="status" id="status">Connecting…</div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getDatabase,ref,onValue} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBjxhhz_OJBayYsnbmmfNlzKrpM3rUZ1f4",
  authDomain: "pool-scoreboard-71c93.firebaseapp.com",
  databaseURL: "https://pool-scoreboard-71c93-default-rtdb.firebaseio.com",
  projectId: "pool-scoreboard-71c93",
  storageBucket: "pool-scoreboard-71c93.firebasestorage.app",
  messagingSenderId: "401721132284",
  appId: "1:401721132284:web:65b755b148d1163a7a4379",
  measurementId: "G-FPBCYM0H1Z"
};

const db=getDatabase(initializeApp(firebaseConfig)), r=ref(db,"poolScoreboard/room1");
onValue(r,s=>{const d={p1:"PLAYER 1",p2:"PLAYER 2",s1:0,s2:0,frame:1,event:"POOL COMPETITION",status:"LIVE",...(s.val()||{})};p1.textContent=d.p1;p2.textContent=d.p2;scores.textContent=`${d.s1} - ${d.s2}`;frame.textContent=`FRAME ${d.frame}`;event.textContent=d.event;status.textContent=d.status;},()=>status.textContent="Connection error");
</script></body></html>
