:root{

</svg><script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBjxhhz_OJBayYsnbmmfNlzKrpM3rUZ1f4",
  authDomain: "pool-scoreboard-71c93.firebaseapp.com",
  databaseURL: "https://pool-scoreboard-71c93-default-rtdb.firebaseio.com",
  projectId: "pool-scoreboard-71c93",
  storageBucket: "pool-scoreboard-71c93.firebasestorage.app",
  messagingSenderId: "401721132284",
  appId: "1:401721132284:web:65b755b148d1163a7a4379",
  measurementId: "G-FPBCYM0H1Z"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const scoreboardRef = ref(db, "poolScoreboard/room1");

const $ = id => document.getElementById(id);

function setText(id, value){
  $(id).textContent = value;
}

onValue(scoreboardRef, snapshot => {

  const d = snapshot.val() || {};

  const p1 = d.p1 ?? "";
  const p2 = d.p2 ?? "";

  const s1 = Number(d.s1 ?? 0);
  const s2 = Number(d.s2 ?? 0);

  const frame = Number(d.frame ?? 1);

  const event = d.event ?? "";
  const match = d.match ?? "";

  setText("p1", p1);
  setText("p2", p2);

  setText("s1", s1);
  setText("s2", s2);

  setText("fr", `FRAME ${frame}`);

  setText("ev2", event);
  setText("ma2", match);

});

</script></body>
