<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pool Scoreboard Control</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;
    background:#101216;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    padding:18px;
  }
  .wrap{max-width:520px;margin:auto}
  h1{font-size:22px;margin:0 0 16px;text-align:center}
  .card{
    background:#191c22;
    border:1px solid #30343d;
    border-radius:16px;
    padding:16px;
    margin-bottom:14px;
  }
  .label{font-size:12px;color:#9da3ad;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
  input{
    width:100%;padding:13px 14px;border-radius:10px;
    border:1px solid #3a3f49;background:#0e1014;color:#fff;
    font-size:16px;outline:none;margin-bottom:10px;
  }
  .players{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .player{text-align:center}
  .name{font-size:14px;color:#c8ccd3;margin-bottom:8px;min-height:18px}
  .score{font-size:46px;font-weight:700;margin:4px 0 12px}
  .buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  button{
    border:0;border-radius:10px;padding:14px 8px;
    font-size:18px;font-weight:700;background:#2a2f38;color:#fff;
  }
  button:active{transform:scale(.97)}
  .minus{background:#353a43}
  .plus{background:#245fba}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .wide{width:100%;margin-top:10px}
  .danger{background:#8b2d35}
  .status{text-align:center;color:#8fd18f;font-size:12px;min-height:18px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Pool Scoreboard Control</h1>

  <div class="card">
    <div class="label">Players</div>
    <div class="players">
      <div class="player">
        <div class="name" id="name1">PLAYER 1</div>
        <div class="score" id="score1">0</div>
        <div class="buttons">
          <button class="minus" onclick="changeScore('s1',-1)">−1</button>
          <button class="plus" onclick="changeScore('s1',1)">+1</button>
        </div>
      </div>
      <div class="player">
        <div class="name" id="name2">PLAYER 2</div>
        <div class="score" id="score2">0</div>
        <div class="buttons">
          <button class="minus" onclick="changeScore('s2',-1)">−1</button>
          <button class="plus" onclick="changeScore('s2',1)">+1</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="label">Player Names</div>
    <input id="inputName1" placeholder="Player 1 name">
    <input id="inputName2" placeholder="Player 2 name">
    <button class="wide plus" onclick="saveNames()">Update Names</button>
  </div>

  <div class="card">
    <div class="label">Frame</div>
    <div class="row">
      <button onclick="changeFrame(-1)">−1 Frame</button>
      <button class="plus" onclick="changeFrame(1)">+1 Frame</button>
    </div>
    <button class="wide plus" onclick="nextFrame()">Next Frame / Reset Points</button>
    <button class="wide danger" onclick="resetPoints()">Reset Points</button>
  </div>

  <div class="card">
    <div class="label">Match Information</div>
    <input id="eventInput" placeholder="Competition">
    <input id="matchInput" placeholder="Match / Round">
    <button class="wide plus" onclick="saveMatchInfo()">Update Match Info</button>
    <button class="wide danger" onclick="resetMatch()">Reset Match</button>
    <div class="status" id="status"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBjxhhz_OJBayYsnbmmfNlzKrpM3rUZ1f4",
  authDomain: "pool-scoreboard-71c93.firebaseapp.com",
  databaseURL: "https://pool-scoreboard-71c93-default-rtdb.firebaseio.com",
  projectId: "pool-scoreboard-71c93",
  storageBucket: "pool-scoreboard-71c93.firebasestorage.app",
  messagingSenderId: "401721132284",
  appId: "1:401721132284:web:65b755b148d1163a7a4379",
  measurementId: "G-FPBCYM0H1Z"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const roomRef = ref(db, "poolScoreboard/room1");

let state = {
  p1:"PLAYER 1", p2:"PLAYER 2", s1:0, s2:0,
  frame:1, event:"DA VILLE DOUBLE LIFE COMP",
  match:"SEMI FINAL | LIFE 2"
};

function showStatus(msg){
  const el=document.getElementById("status");
  el.textContent=msg;
  clearTimeout(showStatus.t);
  showStatus.t=setTimeout(()=>el.textContent="",1500);
}

onValue(roomRef, snap=>{
  const d=snap.val() || {};
  state={...state,...d};

  document.getElementById("name1").textContent=state.p1 || "PLAYER 1";
  document.getElementById("name2").textContent=state.p2 || "PLAYER 2";
  document.getElementById("score1").textContent=Number(state.s1)||0;
  document.getElementById("score2").textContent=Number(state.s2)||0;

  document.getElementById("inputName1").value=state.p1 || "";
  document.getElementById("inputName2").value=state.p2 || "";
  document.getElementById("eventInput").value=state.event || "";
  document.getElementById("matchInput").value=state.match || "";
});

async function safeUpdate(data,msg){
  try{
    await update(roomRef,data);
    showStatus(msg);
  }catch(e){
    showStatus("Update failed");
    console.error(e);
  }
}

window.changeScore=(field,amount)=>{
  const current=Number(state[field])||0;
  safeUpdate({[field]:Math.max(0,current+amount)}, "Score updated");
};

window.saveNames=()=>{
  safeUpdate({
    p1:document.getElementById("inputName1").value.trim() || "PLAYER 1",
    p2:document.getElementById("inputName2").value.trim() || "PLAYER 2"
  },"Names updated");
};

window.changeFrame=(amount)=>{
  const current=Number(state.frame)||1;
  safeUpdate({frame:Math.max(1,current+amount)},"Frame updated");
};

window.resetPoints=()=>{
  safeUpdate({s1:0,s2:0},"Points reset");
};

window.nextFrame=()=>{
  const current=Number(state.frame)||1;
  safeUpdate({frame:current+1,s1:0,s2:0},"Next frame");
};

window.saveMatchInfo=()=>{
  safeUpdate({
    event:document.getElementById("eventInput").value.trim(),
    match:document.getElementById("matchInput").value.trim()
  },"Match info updated");
};

window.resetMatch=()=>{
  safeUpdate({
    s1:0,s2:0,frame:1,
    p1:"PLAYER 1",p2:"PLAYER 2",
    event:"DA VILLE DOUBLE LIFE COMP",
    match:"SEMI FINAL | LIFE 2"
  },"Match reset");
};
</script>
</body>
</html>
