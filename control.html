<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pool Scoreboard Control</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#070b11;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{padding:18px}
.app{max-width:760px;margin:auto}
.header{
  background:linear-gradient(180deg,#121a26,#080d14);
  border:1px solid rgba(255,255,255,.12);
  border-radius:12px;
  padding:18px 20px;
  margin-bottom:14px;
  box-shadow:0 8px 24px rgba(0,0,0,.25)
}
.title{font-size:22px;font-weight:900;letter-spacing:.4px}
.subtitle{font-size:12px;color:#9da8b7;margin-top:5px}
.section{
  background:#0d131c;
  border:1px solid rgba(255,255,255,.10);
  border-radius:12px;
  padding:14px;
  margin-bottom:14px
}
.section-title{
  font-size:12px;font-weight:900;letter-spacing:1px;
  color:#aeb8c6;margin:2px 2px 10px
}
label{display:block;font-size:11px;font-weight:800;color:#9da8b7;margin:10px 2px 6px}
input{
  width:100%;height:48px;border:1px solid #293442;border-radius:9px;
  background:#080d14;color:#fff;padding:0 13px;font-size:16px;font-weight:700;
  outline:none
}
input:focus{border-color:#1688ff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.player-card{
  padding:13px;border-radius:10px;background:#090f17;
  border:1px solid #26313e
}
.player-card.blue{border-top:3px solid #087cff}
.player-card.red{border-top:3px solid #ef173e}
.player-name{font-size:13px;font-weight:900;margin-bottom:10px}
.score-display{text-align:center;font-size:42px;font-weight:900;line-height:1;margin:8px 0 12px}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{
  min-height:46px;border:0;border-radius:9px;color:#fff;
  background:#1a2431;font-size:17px;font-weight:900
}
button:active{transform:scale(.98)}
.plus{background:#087cff}
.minus{background:#27313e}
.redplus{background:#ef173e}
.action-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.action-row button{font-size:14px}
.primary{background:#087cff}
.danger{background:#9f1830}
.neutral{background:#1a2431}
.status{
  text-align:center;font-size:12px;font-weight:800;color:#7f8c9c;
  padding-top:5px
}
@media(max-width:560px){
  body{padding:10px}
  .row{grid-template-columns:1fr}
  .title{font-size:19px}
}
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="title">POOL SCOREBOARD CONTROL</div>
    <div class="subtitle">Remote control • updates the live scoreboard instantly</div>
  </div>

  <div class="section">
    <div class="section-title">PLAYERS & SCORES</div>
    <div class="row">
      <div class="player-card blue">
        <div class="player-name">PLAYER 1</div>
        <input id="p1" value="CEASER CHANDIGA">
        <div class="score-display" id="s1Display">2</div>
        <div class="buttons">
          <button class="minus" id="s1Minus">−1</button>
          <button class="plus" id="s1Plus">+1</button>
        </div>
      </div>

      <div class="player-card red">
        <div class="player-name">PLAYER 2</div>
        <input id="p2" value="ASIKU JUNIOR">
        <div class="score-display" id="s2Display">2</div>
        <div class="buttons">
          <button class="minus" id="s2Minus">−1</button>
          <button class="redplus" id="s2Plus">+1</button>
        </div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">MATCH INFORMATION</div>
    <label>FRAME</label>
    <div class="action-row">
      <button class="minus" id="frameMinus">− FRAME</button>
      <button class="plus" id="framePlus">+ FRAME</button>
    </div>

    <label>COMPETITION</label>
    <input id="status" value="DA VILLE DOUBLE LIFE COMP">

    <label>MATCH / STAGE</label>
    <input id="match" value="SEMI FINAL | LIFE 2">
  </div>

  <div class="section">
    <div class="section-title">MATCH ACTIONS</div>
    <div class="action-row">
      <button class="primary" id="nextFrame">NEXT FRAME</button>
      <button class="neutral" id="resetPoints">RESET POINTS</button>
    </div>
    <div style="height:10px"></div>
    <button class="danger" id="resetAll" style="width:100%">RESET MATCH</button>
  </div>

  <div class="status" id="connection">Connecting…</div>
</div>

<script type="module">
import { initializeApp }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getDatabase, ref, onValue, set }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBjxhhz_OJBayYsnbmmfNlzKrpM3rUZ1f4",
  authDomain: "pool-scoreboard-71c93.firebaseapp.com",
  databaseURL: "https://pool-scoreboard-71c93-default-rtdb.firebaseio.com",
  projectId: "pool-scoreboard-71c93",
  storageBucket: "pool-scoreboard-71c93.firebasestorage.app",
  messagingSenderId: "401721132284",
  appId: "1:401721132284:web:65b755b148d1163a7a4379",
  measurementId: "G-FPBCYM0H1Z"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const room = ref(db, "poolScoreboard/room1");

let state = {
  p1:"CEASER CHANDIGA", p2:"ASIKU JUNIOR",
  s1:2, s2:2, frame:6,
  status:"DA VILLE DOUBLE LIFE COMP",
  match:"SEMI FINAL | LIFE 2"
};

const $ = id => document.getElementById(id);

function render(){
  $("p1").value=state.p1;
  $("p2").value=state.p2;
  $("s1Display").textContent=state.s1;
  $("s2Display").textContent=state.s2;
  $("status").value=state.status;
  $("match").value=state.match;
}

async function save(){
  await set(room,state);
}

onValue(room,snap=>{
  const d=snap.val();
  if(d) state={...state,...d};
  render();
  $("connection").textContent="● LIVE — connected to scoreboard";
});

function bind(id,fn){
  $(id).addEventListener("click",async()=>{
    fn();
    render();
    await save();
  });
}

$("p1").addEventListener("change",async e=>{state.p1=e.target.value.trim()||"PLAYER 1";await save()});
$("p2").addEventListener("change",async e=>{state.p2=e.target.value.trim()||"PLAYER 2";await save()});
$("status").addEventListener("change",async e=>{state.status=e.target.value;await save()});
$("match").addEventListener("change",async e=>{state.match=e.target.value;await save()});

bind("s1Plus",()=>state.s1++);
bind("s1Minus",()=>state.s1=Math.max(0,state.s1-1));
bind("s2Plus",()=>state.s2++);
bind("s2Minus",()=>state.s2=Math.max(0,state.s2-1));
bind("framePlus",()=>state.frame++);
bind("frameMinus",()=>state.frame=Math.max(1,state.frame-1));

bind("resetPoints",()=>{state.s1=0;state.s2=0});
bind("nextFrame",()=>{state.s1=0;state.s2=0;state.frame++});
bind("resetAll",()=>{state={...state,s1:0,s2:0,frame:1}});

render();
</script>
</body>
</html>
